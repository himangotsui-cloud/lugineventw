name: EventArena
version: '1.0.0'
main: com.eventarena.plugin.EventArenaPlugin
api-version: '1.20'
author: EventArena
description: PvP event / arena plugin with Crystal, Mace, Sword and Axe modes.

commands:
  event:
    description: Main event command
    usage: /event [make|announce|join|leave|start|stop|status]
    permission: event.use
  border:
    description: Set the event playable border size
    usage: /border <size>
    permission: event.border
  drop:
    description: Clear the event arena down to the bedrock floor
    usage: /drop
    permission: event.drop
  revive:
    description: Revive an eliminated player
    usage: /revive <all|player>
    permission: event.revive

permissions:
  event.admin:
    description: Full administrative access to the event plugin
    default: op
    children:
      event.border: true
      event.drop: true
      event.revive: true
      event.announce: true
      event.make: true
  event.use:
    description: Basic event commands (join/leave/status)
    default: true
  event.make:
    description: Create/configure events
    default: op
  event.border:
    description: Change the event border
    default: op
  event.drop:
    description: Clear the arena
    default: op
  event.revive:
    description: Revive players
    default: op
  event.announce:
    description: Send event announcements
    default: op
